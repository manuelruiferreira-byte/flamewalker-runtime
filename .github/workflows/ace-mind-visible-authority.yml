name: Validate ACE Mind Deterministic Authority
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'Jester-Intelligence/ACED-Lifestyle/**'
      - 'tests/ace-resonance/**'
      - '.github/workflows/ace-mind-visible-authority.yml'
      - 'service-worker.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-canonical-card-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure-engine regression and canonical snapshot
        run: node --test tests/ace-resonance/engine.test.cjs
      - name: Install browser test tools
        run: npm install --no-save @playwright/test@1.61.1
      - name: Install independent browser engines
        run: npx playwright install --with-deps chromium firefox
      - name: Phone, tablet, desktop and reinstall regression
        run: node tests/ace-resonance/browser.cjs
        env:
          ACE_SCREENSHOTS: test-results/ace-resonance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace-resonance-browser-evidence
          path: test-results/ace-resonance
